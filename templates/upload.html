<!-- templates/upload.html -->
{% extends "base.html" %}
{% block content %}
<div class="content">
    <h2>Upload PDF Files</h2>

    <form id="upload-form" onsubmit="return false;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="file" id="pdf-input" accept="application/pdf" multiple required><br><br>
        <p class="hint">Up to {{ (max_upload_bytes / 1024 / 1024) | round(0) | int }} MB per file.
           Files upload straight to S3 and are indexed in the background.</p>
        <button type="submit" class="btn">Upload and Process</button>
    </form>

    <p id="upload-status"></p>
    <div id="loader" style="display:none;">
        <p>Indexing... this continues even if you close the page.</p>
        <div class="spinner"></div>
    </div>
</div>

<script>
(function () {
    var LIMIT = {{ max_upload_bytes }};
    var form = document.getElementById('upload-form');
    var input = document.getElementById('pdf-input');
    var status = document.getElementById('upload-status');
    var loader = document.getElementById('loader');
    var csrf = form.querySelector('input[name=csrf_token]').value;

    function say(message, isError) {
        status.textContent = message;
        status.style.color = isError ? '#c0392b' : '';
    }

    // Ask the app for a presigned POST, then send the file to S3 directly.
    // The bytes never pass through Lambda, so the 6 MB invocation limit and the
    // request timeout are both out of the picture.
    async function uploadOne(file) {
        var body = new FormData();
        body.append('filename', file.name);
        body.append('csrf_token', csrf);

        var res = await fetch('{{ url_for("upload_url") }}', {
            method: 'POST', body: body, headers: {'X-CSRFToken': csrf}
        });
        if (!res.ok) throw new Error((await res.json()).error || 'could not start upload');
        var data = await res.json();

        // S3 requires the policy fields to precede the file part.
        var s3form = new FormData();
        Object.entries(data.upload.fields).forEach(function (kv) { s3form.append(kv[0], kv[1]); });
        s3form.append('file', file);

        var s3res = await fetch(data.upload.url, {method: 'POST', body: s3form});
        if (!s3res.ok) throw new Error('S3 rejected ' + file.name + ' (' + s3res.status + ')');
        return data.document;
    }

    // Ingestion is asynchronous, so completion means "the document shows up in
    // the index", not "the upload returned".
    async function waitForIndex(names, timeoutMs) {
        var deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline) {
            var docs = (await (await fetch('{{ url_for("documents") }}')).json()).documents;
            if (names.every(function (n) { return docs.indexOf(n) !== -1; })) return true;
            await new Promise(function (r) { setTimeout(r, 2000); });
        }
        return false;
    }

    form.addEventListener('submit', async function () {
        var files = Array.prototype.slice.call(input.files);
        if (!files.length) return;

        var tooBig = files.filter(function (f) { return f.size > LIMIT; });
        if (tooBig.length) {
            say(tooBig[0].name + ' is ' + (tooBig[0].size / 1048576).toFixed(1) +
                ' MB, over the ' + (LIMIT / 1048576).toFixed(0) + ' MB limit.', true);
            return;
        }

        form.querySelector('button').disabled = true;
        loader.style.display = 'block';
        try {
            var names = [];
            for (var i = 0; i < files.length; i++) {
                say('Uploading ' + files[i].name + ' (' + (i + 1) + '/' + files.length + ')...');
                names.push(await uploadOne(files[i]));
            }
            say('Uploaded. Indexing ' + names.length + ' document(s)...');
            if (await waitForIndex(names, 300000)) {
                window.location.href = '{{ url_for("home") }}';
            } else {
                say('Still indexing. Return to the home page shortly to see it.', false);
            }
        } catch (err) {
            say(err.message, true);
        } finally {
            form.querySelector('button').disabled = false;
            loader.style.display = 'none';
        }
    });
})();
</script>
{% endblock %}
