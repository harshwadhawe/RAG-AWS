<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title | default("Ask") }} · {{ app_name }}</title>
    <meta name="description" content="{{ app_tagline }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="{{ url_for('home') }}">{{ app_name }}</a>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Ask</a></li>
                <li><a href="{{ url_for('upload_page') }}">Add documents</a></li>
                <li><a href="{{ source_url }}" target="_blank" rel="noopener">Source</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>{{ app_name }} — {{ app_tagline }}</p>
    </footer>
    <!-- Include JavaScript for loader functionality -->
    <script>
        function showLoader() {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.style.display = 'block';
            }
            // Disable submit buttons to prevent multiple submissions
            var submitButtons = document.querySelectorAll('input[type="submit"], button[type="submit"]');
            submitButtons.forEach(function(button) {
                button.disabled = true;
                // For <button>, change textContent; for <input>, change value
                if (button.tagName.toLowerCase() === 'button') {
                    button.textContent = 'Processing...';
                } else {
                    button.value = 'Processing...';
                }
            });
        }
    </script>
</body>
</html>
